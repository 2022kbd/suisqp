							<head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Sister AI - Your Caring Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #f5f1ff 0%, #e8f5e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 90%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #ffd6e8 0%, #e6ccff 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #f0e6ff;
        }

        .header h1 {
            color: #8b4a8c;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #a66ba6;
            font-size: 14px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffb6d6, #d4a4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 10px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: linear-gradient(to bottom, #fefefe, #f9f9ff);
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.ai .message-bubble {
            background: linear-gradient(135deg, #e6f3ff 0%, #f0e6ff 100%);
            color: #5a5a8a;
            border: 1px solid #d4e6ff;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #ffe6f3 0%, #fff0e6 100%);
            color: #8a5a8a;
            border: 1px solid #ffd4e6;
        }

        .input-area {
            padding: 20px;
            background: linear-gradient(90deg, #f9f9ff 0%, #fff9f9 100%);
            border-top: 1px solid #e6e6ff;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e6d6ff;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: white;
            font-family: inherit;
        }

        .message-input:focus {
            border-color: #d4a4ff;
            box-shadow: 0 0 0 3px rgba(212, 164, 255, 0.2);
        }

        .send-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #ffb6d6 0%, #d4a4ff 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 164, 255, 0.4);
        }

        .kindness-stars {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 3px;
        }

        .star {
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ffd700, #ffb347);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .feeling-flower {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #ffcccb, #ffd6e8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .feeling-flower:hover {
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .app-container {
                width: 95%;
                height: 90vh;
            }
            
            .message-bubble {
                max-width: 85%;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="kindness-stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
        
        <div class="header">
            <div class="avatar">🌸</div>
            <h1>Big Sister AI</h1>
            <p>Your caring companion for kindness and understanding</p>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message ai">
                    <div class="message-bubble">
                        Hi there! 🌈 I'm your Big Sister AI, and I'm so happy to meet you! I'm here to help you understand feelings, be kind to others, and make the world a little brighter. What's on your heart today?
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="text" class="message-input" id="messageInput" placeholder="Tell me about your day or how you're feeling...">
                    <button class="send-button" id="sendButton">Send 💝</button>
                </div>
            </div>
        </div>
    </div>

    <div class="feeling-flower" title="Feeling Flower - Click to explore emotions!">
        🌻
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const feelingFlower = document.querySelector('.feeling-flower');

        // Sample AI responses for demo purposes
        const aiResponses = [
            "That sounds like it might have been challenging. Let's think about how the other person might have been feeling too. What do you think? 💭",
            "I hear you! Sometimes our feelings can feel really big. Let's take a deep breath together and think of one small kind thing we could do today. 🌸",
            "That's wonderful that you're sharing this with me! How do you think we could turn this into a kindness mission? 🌟",
            "It sounds like you're learning so much about feelings! Remember, every emotion teaches us something important. What do you think this feeling is trying to tell you? 💛",
            "Let's imagine we're planting seeds of kindness. What kind word or action could help someone's day bloom brighter? 🌱"
        ];

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = content;
            
            messageDiv.appendChild(bubbleDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                addMessage(message, true);
                messageInput.value = '';
                
                // Simulate AI response after a short delay
                setTimeout(() => {
                    const randomResponse = aiResponses[Math.floor(Math.random() * aiResponses.length)];
                    addMessage(randomResponse);
                }, 1000);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        feelingFlower.addEventListener('click', () => {
            const feelings = ['happy 😊', 'sad 😢', 'excited 🤗', 'worried 😰', 'proud 😌', 'lonely 😔', 'grateful 🙏', 'curious 🤔'];
            const randomFeeling = feelings[Math.floor(Math.random() * feelings.length)];
            addMessage(`I notice you clicked the Feeling Flower! Are you feeling ${randomFeeling} right now? Tell me more about it! 🌻`);
        });

        // Focus on input when page loads
        messageInput.focus();
    </script>


</body></html>
