<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Sister AI 🌷</title>
<style>
body {
  background: linear-gradient(to bottom right, #ffdfe8, #d7f4f0);
  font-family: 'Comic Sans MS', 'Poppins', sans-serif;
  color: #444;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  height: 100vh;
}
.chat-container {
  background-color: #fffafc;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  width: 90%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat-header {
  background-color: #f9b0c3;
  color: white;
  text-align: center;
  padding: 1em;
  font-size: 1.3em;
  font-weight: bold;
  position: relative;
}
.star-counter {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1em;
}
.messages {
  flex: 1;
  padding: 1em;
  overflow-y: auto;
}
.message {
  margin: 0.5em 0;
  padding: 0.8em 1em;
  border-radius: 12px;
  line-height: 1.4;
}
.user {
  background: #d7f4f0;
  align-self: flex-end;
}
.ai {
  background: #ffe7ef;
  align-self: flex-start;
}
.input-area {
  display: flex;
  background: #fff;
  border-top: 2px solid #f9b0c3;
}
input {
  border: none;
  flex: 1;
  padding: 1em;
  font-size: 1em;
  outline: none;
}
button {
  background: #f9b0c3;
  color: white;
  border: none;
  padding: 0 1.5em;
  cursor: pointer;
  font-weight: bold;
}
button:hover {
  background: #f4899a;
}

/* Feeling flower styles */
.feeling-flower {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0.5em 1em;
  background: #fffafc;
  border-bottom: 2px solid #f9b0c3;
}
.feeling-flower button {
  background: none;
  border: none;
  font-size: 1.5em;
  margin: 0.3em;
  cursor: pointer;
  transition: transform 0.2s;
}
.feeling-flower button:hover {
  transform: scale(1.2);
}
</style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      🌷 Big Sister AI 🌷
      <div class="star-counter">⭐ <span id="starCount">0</span></div>
    </div>

    <div class="feeling-flower">
      <span>🌼 Choose your Feeling:</span>
      <button onclick="selectFeeling('happy')">😊</button>
      <button onclick="selectFeeling('sad')">😢</button>
      <button onclick="selectFeeling('angry')">😠</button>
      <button onclick="selectFeeling('shy')">😳</button>
      <button onclick="selectFeeling('lonely')">😔</button>
      <button onclick="selectFeeling('proud')">😌</button>
    </div>

    <div class="messages" id="messages">
      <div class="message ai">
        Hi there! I’m your Big Sister AI 💖  
        I listen to your feelings and help you find kind ways to act.  
        Say “Big Sister mode on!” to begin.
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
let starCount = 0;
let currentFeeling = null;

const messages = document.getElementById('messages');
const input = document.getElementById('userInput');
const starDisplay = document.getElementById('starCount');

function selectFeeling(feeling) {
  currentFeeling = feeling;
  let msg = "";
  switch(feeling) {
    case 'happy': msg = "💛 I’m glad you feel happy! Who or what brought sunshine today?"; break;
    case 'sad': msg = "💙 It’s okay to feel sad sometimes. What could bring you a little comfort right now?"; break;
    case 'angry': msg = "🔴 That’s strong energy! Maybe take a few deep breaths — what might help calm your red petal?"; break;
    case 'shy': msg = "💜 Feeling shy just means your heart is gentle. What’s something that feels safe right now?"; break;
    case 'lonely': msg = "🌫️ When you feel lonely, reaching out helps. Could you wave or message someone today?"; break;
    case 'proud': msg = "🌟 That’s wonderful! What are you proud of? Let’s celebrate your gold petal!"; break;
  }
  addMessage(msg, "ai");
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    const reply = getResponse(text.toLowerCase());
    addMessage(reply, "ai");
  }, 600);
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.classList.add("message", sender);
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function earnStar() {
  starCount++;
  starDisplay.textContent = starCount;
  addMessage("🌈 You’ve earned a Kindness Star! ⭐ Total: " + starCount, "ai");
}

function getResponse(input) {
  if (input.includes("big sister mode on")) {
    return "🌸 Big Sister mode is on! Let’s explore your feelings. Tap a 🌼 emotion above to start.";
  }
  if (input.includes("thank")) {
    earnStar();
    return "You’re welcome, kind heart 💖 Every thank-you grows your kindness garden.";
  }
  if (input.includes("mission")) {
    earnStar();
    const missions = [
      "🕊️ Peace Mission: Smile at someone who looks lonely today.",
      "🌈 Caring Mission: Help a family member without being asked.",
      "🌸 Friendship Mission: Write a kind note for a friend.",
      "💫 Joy Mission: Compliment someone sincerely today."
    ];
    const pick = missions[Math.floor(Math.random() * missions.length)];
    return "Here’s your Kindness Mission:\n" + pick;
  }
  if (input.includes("sad") || input.includes("cry")) {
    return "It’s okay to feel blue 💙 Sometimes sharing or hugging helps your flower bloom again.";
  }
  if (input.includes("angry") || input.includes("mad")) {
    return "Anger means your boundaries matter 🔴 Let’s take a breath and think of what could make peace.";
  }
  if (input.includes("lonely")) {
    return "Loneliness is a gray petal 🌧️ — maybe reach out or do something creative to feel connection.";
  }
  if (input.includes("happy")) {
    earnStar();
    return "🌞 I’m so glad you’re happy! Sharing joy gives others Kindness Stars too!";
  }
  return "🌷 I hear you. Tell me more — what are you feeling right now?";
}
</script>


</body></html>
