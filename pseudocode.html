<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Quiz Prep | Cambridge Grade 7 · Ch.1 Pseudocode</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;background:linear-gradient(155deg,#0d0d2b 0%,#1a1040 45%,#0d2b4a 100%);background-attachment:fixed;color:#fff;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;padding:18px}
.screen.active{display:flex;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13);border-radius:18px}
.btn{border:none;border-radius:11px;padding:11px 22px;cursor:pointer;font:600 .9rem inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.btn:active{transform:translateY(0)}
.btn-pri{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-cyan{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#061833}
.btn-grn{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#06200f}
.btn-red{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}
.btn-ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.2)}
.btn-ghost:hover{background:rgba(255,255,255,.18);color:#fff}

/* ═══════════ SCREEN 1 : LANGUAGE ═══════════ */
#ls{justify-content:center;gap:40px;text-align:center}
.ls-badge{display:inline-block;background:rgba(79,172,254,.12);border:1px solid rgba(79,172,254,.3);color:#4facfe;padding:5px 18px;border-radius:20px;font-size:.73rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
.ls-h1{font-size:2.8rem;font-weight:800;line-height:1.1;margin-bottom:10px;background:linear-gradient(135deg,#fff,#b0ccf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ls-sub{font-size:.9rem;opacity:.6;line-height:1.7}
.ls-opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.ls-opt{padding:28px 44px;cursor:pointer;transition:all .3s;text-align:center;border-radius:18px}
.ls-opt:hover{transform:translateY(-6px);background:rgba(255,255,255,.11);box-shadow:0 14px 34px rgba(0,0,0,.3)}
.lo-flag{font-size:2.5rem;margin-bottom:9px}
.lo-name{font-size:1.18rem;font-weight:700;margin-bottom:3px}
.lo-sub{font-size:.8rem;opacity:.6}

/* ═══════════ SCREEN 2 : HOME ═══════════ */
#hs{gap:0}
.hm-hdr{width:100%;max-width:860px;text-align:center;padding:28px 14px 20px}
.hm-badge{display:inline-block;background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.3);color:#ffc107;padding:4px 16px;border-radius:15px;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.hm-h1{font-size:1.9rem;font-weight:800;margin-bottom:5px}
.hm-p{font-size:.86rem;opacity:.55}
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%;max-width:860px;padding:0 8px}
@media(max-width:660px){.act-grid{grid-template-columns:1fr}}
.acard{padding:22px 16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.acard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:18px 18px 0 0}
.acard.cFlash::before{background:linear-gradient(90deg,#4facfe,#00f2fe)}
.acard.cTest::before{background:linear-gradient(90deg,#f093fb,#f5576c)}
.acard.cMatch::before{background:linear-gradient(90deg,#43e97b,#38f9d7)}
.acard:hover{transform:translateY(-5px);background:rgba(255,255,255,.1);box-shadow:0 13px 30px rgba(0,0,0,.25)}
.ac-ico{font-size:2.4rem;margin-bottom:10px}
.ac-ttl{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.ac-dsc{font-size:.78rem;opacity:.6;line-height:1.5;margin-bottom:13px}
.ac-bdg{display:inline-block;padding:3px 10px;border-radius:13px;font-size:.71rem;font-weight:600}
.ac-bdg.pend{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.12)}
.ac-bdg.done{background:rgba(67,233,123,.12);color:#43e97b;border:1px solid rgba(67,233,123,.25)}
.hm-scores{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;width:100%;max-width:860px;margin:13px 8px 0;padding:15px 20px}
.sci{text-align:center}
.sci-lbl{font-size:.69rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:3px}
.sci-val{font-size:1.35rem;font-weight:800}
.sci-val.v1{color:#4facfe}.sci-val.v2{color:#43e97b}.sci-val.v3{color:#ffc107}
.hm-acts{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap;justify-content:center}

/* ═══════════ SCREEN 3 : SECTION ═══════════ */
#sec{padding:13px 16px 20px;gap:0}
.sec-nav{width:100%;max-width:940px;display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sec-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:8px 14px;cursor:pointer;color:white;font:inherit;font-size:.85rem;transition:all .2s}
.sec-back:hover{background:rgba(255,255,255,.16)}
.sec-ttl{font-size:1.12rem;font-weight:700}
.sec-lng{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 12px;cursor:pointer;color:rgba(255,255,255,.72);font:inherit;font-size:.79rem;transition:all .2s;white-space:nowrap}
.sec-lng:hover{background:rgba(255,255,255,.13);color:#fff}
#ca{width:100%;max-width:940px}

/* ═══════════ FLASHCARDS ═══════════ */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-stat{font-size:.82rem;opacity:.52}
.fc-box{width:100%;max-width:660px;height:270px;perspective:1000px;cursor:pointer;user-select:none}
.fc-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-side{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px 32px;text-align:center}
.fc-fr{background:linear-gradient(135deg,rgba(79,172,254,.15),rgba(0,242,254,.05));border:1.5px solid rgba(79,172,254,.28)}
.fc-bk{background:linear-gradient(135deg,rgba(102,126,234,.22),rgba(118,75,162,.15));border:1.5px solid rgba(118,75,162,.35);transform:rotateY(180deg)}
.fc-lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:2px;opacity:.42;margin-bottom:12px}
.fc-trm{font-size:1.62rem;font-weight:700;line-height:1.2}
.fc-hnt{font-size:.73rem;opacity:.3;margin-top:14px}
.fc-dfn{font-size:.91rem;line-height:1.65}
.fc-nav{display:flex;gap:10px;align-items:center}
.fc-nbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:10px 18px;cursor:pointer;color:white;font:inherit;font-size:.87rem;transition:all .2s}
.fc-nbtn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.fc-nbtn:disabled{opacity:.2;cursor:default;transform:none!important;box-shadow:none!important}
.fc-cnt{font-size:.82rem;opacity:.5;min-width:55px;text-align:center}
.fc-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:660px;padding:0 8px}
.fc-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .2s;flex-shrink:0}
.fc-dot.act{background:#4facfe;transform:scale(1.35)}
.fc-dot:hover{background:rgba(79,172,254,.6)}

/* ═══════════ TEST ═══════════ */
.tst-wrap{display:flex;flex-direction:column;gap:13px}
.tst-meta{display:flex;justify-content:space-between;font-size:.82rem;opacity:.62}
.prog{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:8px;transition:width .4s ease}
.pf-blue{background:linear-gradient(90deg,#667eea,#764ba2)}
.pf-grn{background:linear-gradient(90deg,#43e97b,#38f9d7)}
.qcard{padding:26px}
.q-lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:1.5px;opacity:.42;margin-bottom:10px}
.q-txt{font-size:1.07rem;font-weight:600;line-height:1.58;margin-bottom:20px}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:10px;padding:12px 16px;cursor:pointer;color:white;font:inherit;font-size:.89rem;text-align:left;transition:all .18s;line-height:1.4}
.q-opt:hover:not([disabled]){background:rgba(255,255,255,.11);border-color:rgba(102,126,234,.5)}
.q-opt.cor{background:rgba(67,233,123,.18);border-color:#43e97b}
.q-opt.wrg{background:rgba(245,87,108,.18);border-color:#f5576c}
.q-opt[disabled]{cursor:default}
.q-exp{display:none;background:rgba(102,126,234,.1);border-left:3px solid #667eea;border-radius:0 9px 9px 0;padding:11px 15px;font-size:.85rem;line-height:1.57;margin-top:12px}
.q-exp.show{display:block;animation:fadeUp .3s ease}
.q-nxt{display:none;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;padding:12px 28px;color:#fff;font:700 .89rem inherit;cursor:pointer;transition:all .2s}
.q-nxt.show{display:block;animation:fadeUp .3s ease}
.q-nxt:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(102,126,234,.4)}
.tst-done{text-align:center;padding:46px 28px}
.td-ico{font-size:3.9rem;margin-bottom:12px}
.td-h2{font-size:1.75rem;font-weight:800;margin-bottom:8px}
.td-sc{font-size:2.9rem;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0}
.td-p{font-size:.87rem;opacity:.62;margin-bottom:18px}

/* ═══════════ MATCHING ═══════════ */
.mch-wrap{display:flex;flex-direction:column;gap:12px}
.mch-instr{text-align:center;font-size:.84rem;opacity:.62;padding:9px 14px;background:rgba(255,255,255,.04);border-radius:9px}
.mch-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:580px){.mch-grid{grid-template-columns:1fr}}
.mch-clbl{font-size:.67rem;text-transform:uppercase;letter-spacing:1.5px;opacity:.43;text-align:center;margin-bottom:6px}
.mch-col{display:flex;flex-direction:column;gap:7px}
.mi{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.13);border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit;font-size:.86rem;color:white;text-align:left;transition:all .18s;line-height:1.4;min-height:50px;display:flex;align-items:center;width:100%}
.mi:hover:not(.mat){background:rgba(255,255,255,.1);border-color:rgba(102,126,234,.45)}
.mi.sel{background:rgba(102,126,234,.22);border-color:#667eea;box-shadow:0 0 0 2px rgba(102,126,234,.3)}
.mi.mat{background:rgba(67,233,123,.1);border-color:rgba(67,233,123,.35);cursor:default;opacity:.78}
.mi.wfl{animation:shake .42s ease;background:rgba(245,87,108,.18);border-color:#f5576c}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.mch-done{text-align:center;padding:44px 28px}

/* ═══════════ SCREEN 4 : RESULTS ═══════════ */
#rr{justify-content:center}
.res-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0;width:100%;max-width:680px}
.res-hero{text-align:center}
.res-ico{font-size:3.8rem;margin-bottom:12px}
.res-h2{font-size:1.9rem;font-weight:800;margin-bottom:5px}
.res-p{font-size:.87rem;opacity:.57}
.res-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
@media(max-width:460px){.res-cards{grid-template-columns:1fr}}
.rc{padding:20px;text-align:center}
.rc-ico{font-size:1.65rem;margin-bottom:6px}
.rc-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;opacity:.48;margin-bottom:4px}
.rc-sc{font-size:2.15rem;font-weight:800}
.rc-mx{font-size:.8rem;opacity:.43}
.rc-bar{height:5px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;margin-top:8px}
.rc-fill{height:100%;border-radius:7px;transition:width .85s ease .15s}
.rf1{background:linear-gradient(90deg,#667eea,#764ba2)}.rf2{background:linear-gradient(90deg,#43e97b,#38f9d7)}
.tot-card{width:100%;background:linear-gradient(135deg,rgba(255,193,7,.13),rgba(255,152,0,.08));border:1.5px solid rgba(255,193,7,.26);border-radius:22px;padding:26px 38px;text-align:center}
.tc-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:#ffc107;opacity:.76;margin-bottom:7px}
.tc-sc{font-size:3.8rem;font-weight:800;color:#ffc107;line-height:1}
.tc-mx{font-size:1.15rem;opacity:.52;margin-top:3px}
.tc-gr{font-size:.95rem;color:#43e97b;margin-top:12px;font-weight:600}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

    <div class="ls-badge">Cambridge Grade 7 · Chapter 1</div>

</div>

<!-- ═══════════ SCREEN 2 : HOME ═══════════ -->
<div id="hs" class="screen">
  <div class="hm-hdr">
    <div class="hm-badge" id="hBdg"></div>
    <h1 class="hm-h1" id="hTtl"></h1>
    <p class="hm-p" id="hSub"></p>
  </div>
  <div class="act-grid">

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const S={
  lang:'en', sec:null,
  fcI:0, fcF:false,
  tI:0, tSc:0, tDn:false,
  mSc:0, mDn:false,
  mSel:null, mMat:[], mAtt:[], mShuf:[]
};

// ═══════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════
const $  = id => document.getElementById(id);
const set= (id,v) => { $(id).textContent = v; };
const u  = () => D.ui[S.lang];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

function shuf(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

// ═══════════════════════════════════════════════════════
//  LANGUAGE
// ═══════════════════════════════════════════════════════
function setLang(l){ S.lang=l; updHome(); showScreen('hs'); }

function togLang(){
  S.lang = S.lang==='en' ? 'zh' : 'en';
  updNav();
  if(S.sec==='fc')      rendFC();
  else if(S.sec==='tq') rendTQ();
  else if(S.sec==='mp'){ initMP(); rendMP(); }
}

// ═══════════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════════
function updHome(){
  const U=u();
  set('hBdg',U.bdg); set('hTtl',U.ttl); set('hSub',U.sub);
  set('aFT',U.fT);   set('aFD',U.fD);
  set('aTT',U.qT);   set('aTD',U.qD);
  set('aMT',U.mT);   set('aMD',U.mD);
  set('hSL1',U.sL1); set('hSL2',U.sL2); set('hSL3',U.sL3);
  $('hVR').textContent=U.vr;
  $('hCL').textContent=U.cl;

  // Flashcard badge — always "study only"
  $('aFB').textContent=U.fB; $('aFB').className='ac-bdg pend';

  // Test badge
  if(S.tDn){
    $('aTB').textContent=`✓ ${S.tSc}/15`; $('aTB').className='ac-bdg done';
    set('hS1',`${S.tSc}/15`);
  } else {
    $('aTB').textContent=U.qB; $('aTB').className='ac-bdg pend';
    set('hS1','—');
  }

  // Match badge
  if(S.mDn){
    $('aMB').textContent=`✓ ${S.mSc}/10`; $('aMB').className='ac-bdg done';
    set('hS2',`${S.mSc}/10`);
  } else {
    $('aMB').textContent=U.mB; $('aMB').className='ac-bdg pend';
    set('hS2','—');
  }

  // Total
  set('hS3', (S.tDn&&S.mDn) ? `${S.tSc+S.mSc}/25` : '—');
}

function goHome(){ updHome(); showScreen('hs'); }

// ═══════════════════════════════════════════════════════
//  SECTION NAVIGATION
// ═══════════════════════════════════════════════════════
function startSec(s){
  S.sec=s; updNav();
  if(s==='fc'){
    S.fcI=0; S.fcF=false; rendFC();
  } else if(s==='tq'){
    if(!S.tDn){ S.tI=0; S.tSc=0; }
    rendTQ();
  } else if(s==='mp'){
    if(!S.mDn) initMP();
    rendMP();
  }
  showScreen('sec');
}

function updNav(){
  const U=u();
  $('sBack').textContent = U.bk;
  $('sLng').textContent  = U.lng;
  const nm={fc:U.fcN, tq:U.qN, mp:U.mN};
  set('sTtl', nm[S.sec]||'');
}

// ═══════════════════════════════════════════════════════
//  FLASHCARDS
// ═══════════════════════════════════════════════════════
function rendFC(){
  const U=u(), cards=D.fc[S.lang], c=cards[S.fcI], n=cards.length;
  const dots = cards.map((_,i)=>
    `<div class="fc-dot${i===S.fcI?' act':''}" onclick="fcJmp(${i})"></div>`
  ).join('');
  $('ca').innerHTML=`
    <div class="fc-wrap">
      <div class="fc-stat">${U.fOf} ${S.fcI+1} ${U.fSl} ${n}</div>
      <div class="fc-box" onclick="fcFlp()">
        <div class="fc-inner${S.fcF?' flipped':''}" id="fci">
          <div class="fc-side fc-fr">
            <div class="fc-lbl">${U.fFr}</div>
            <div class="fc-trm">${c.t}</div>
            <div class="fc-hnt">${U.fHnt}</div>
          </div>
          <div class="fc-side fc-bk">
            <div class="fc-lbl">${U.fBk}</div>
            <div class="fc-dfn">${c.d}</div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="fc-nbtn" onclick="fcPr()" ${S.fcI===0?'disabled':''}>${U.fPr}</button>
        <span class="fc-cnt">${S.fcI+1} / ${n}</span>
        <button class="fc-nbtn" onclick="fcNx()">${S.fcI<n-1?U.fNx:U.fDn}</button>
      </div>
      <div class="fc-dots">${dots}</div>
    </div>`;
}

function fcFlp(){
  S.fcF=!S.fcF;
  const el=$('fci');
  if(el) el.classList.toggle('flipped', S.fcF);
}
function fcPr(){ if(S.fcI>0){ S.fcI--; S.fcF=false; rendFC(); } }
function fcNx(){
  const n=D.fc[S.lang].length;
  if(S.fcI<n-1){ S.fcI++; S.fcF=false; rendFC(); } else goHome();
}
function fcJmp(i){ S.fcI=i; S.fcF=false; rendFC(); }

// ═══════════════════════════════════════════════════════
//  TEST (QUIZ)
// ═══════════════════════════════════════════════════════
function rendTQ(){
  const U=u(), qs=D.tq[S.lang];
  if(S.tDn){
    $('ca').innerHTML=`
      <div class="tst-wrap">
        <div class="qcard glass tst-done">
          <div class="td-ico">🎯</div>
          <h2 class="td-h2">${U.qDT}</h2>
          <p class="td-p">${U.qSL}</p>
          <div class="td-sc">${S.tSc} / 15</div>
          <button class="btn btn-pri" onclick="retTQ()" style="margin-top:16px">${U.qRet}</button>
        </div>
      </div>`;
    return;
  }
  const q=qs[S.tI], pct=(S.tI/qs.length)*100;
  $('ca').innerHTML=`
    <div class="tst-wrap">
      <div class="tst-meta">
        <span>${U.qOf} ${S.tI+1} / ${qs.length}</span>
        <span id="tsd">${U.qSc} ${S.tSc}</span>
      </div>
      <div class="prog"><div class="prog-fill pf-blue" style="width:${pct}%"></div></div>
      <div class="qcard glass">
        <div class="q-lbl">${U.qOf} ${S.tI+1}</div>
        <div class="q-txt">${q.q}</div>
        <div class="q-opts">
          ${q.o.map((o,i)=>`<button class="q-opt" id="qo${i}" onclick="pickQ(${i})">${o}</button>`).join('')}
        </div>
        <div class="q-exp" id="qex">💡 ${q.e}</div>
      </div>
      <button class="q-nxt" id="qnxt" onclick="${S.tI<qs.length-1?'nxtQ()':'finQ()'}">
        ${S.tI<qs.length-1?U.qNx:U.qFin}
      </button>
    </div>`;
}

function pickQ(i){
  const q=D.tq[S.lang][S.tI];
  document.querySelectorAll('.q-opt').forEach(b=>b.disabled=true);
  $(`qo${q.a}`).classList.add('cor');
  if(i!==q.a) $(`qo${i}`).classList.add('wrg');
  else S.tSc++;
  $('qex').classList.add('show');
  $('qnxt').classList.add('show');
  const tsd=$('tsd');
  if(tsd) tsd.textContent=`${u().qSc} ${S.tSc}`;
}
function nxtQ(){ S.tI++; rendTQ(); }
function finQ(){ S.tDn=true; updHome(); rendTQ(); }
function retTQ(){ S.tI=0; S.tSc=0; S.tDn=false; rendTQ(); }

// ═══════════════════════════════════════════════════════
//  MATCHING
// ═══════════════════════════════════════════════════════
function initMP(){
  S.mSc=0; S.mSel=null; S.mMat=[]; S.mAtt=[];
  S.mShuf = shuf(D.mp[S.lang].map((p,i)=>({...p, oi:i})));
}

function rendMP(){
  if(!S.mShuf.length) initMP();
  const U=u(), pairs=D.mp[S.lang];

  if(S.mDn){
    $('ca').innerHTML=`
      <div class="mch-wrap">
        <div class="qcard glass mch-done">
          <div style="font-size:3.5rem;margin-bottom:12px">🎊</div>
          <h2 style="font-size:1.7rem;font-weight:800;margin-bottom:8px">${U.mDT}</h2>
          <p style="opacity:.65;margin-bottom:18px">${U.mSL}
            <strong style="font-size:1.5rem;color:#43e97b">${S.mSc}/10</strong>
          </p>
          <button class="btn btn-grn" onclick="retMP()">${U.mRet}</button>
        </div>
      </div>`;
    return;
  }

  const pct=(S.mMat.length/pairs.length)*100;

  const tH=pairs.map((p,i)=>{
    const m=S.mMat.includes(i), s=(S.mSel===i&&!m);
    return `<button class="mi${m?' mat':''}${s?' sel':''}" id="mt${i}" onclick="pTerm(${i})">${m?'✓ ':''}${p.t}</button>`;
  }).join('');

  const dH=S.mShuf.map((d,i)=>{
    const m=S.mMat.includes(d.oi);
    return `<button class="mi${m?' mat':''}" id="md${i}" onclick="pDef(${i})">${m?'✓ ':''}${d.d}</button>`;
  }).join('');

  $('ca').innerHTML=`
    <div class="mch-wrap">
      <div class="tst-meta">
        <span>${U.mPr} <strong style="color:#43e97b">${S.mMat.length} / ${pairs.length}</strong></span>
        <span style="color:#ffc107">${U.mSc} ${S.mSc} / ${pairs.length}</span>
      </div>
      <div class="prog"><div class="prog-fill pf-grn" style="width:${pct}%"></div></div>
      <div class="mch-instr">${U.mIn}</div>
      <div class="mch-grid">
        <div>
          <div class="mch-clbl">${U.tLbl}</div>
          <div class="mch-col">${tH}</div>
        </div>
        <div>
          <div class="mch-clbl">${U.dLbl}</div>
          <div class="mch-col">${dH}</div>
        </div>
      </div>
    </div>`;
}

function pTerm(i){
  if(!S.mMat.includes(i)){ S.mSel=i; rendMP(); }
}

function pDef(si){
  if(S.mSel===null) return;
  const d=S.mShuf[si];
  if(S.mMat.includes(d.oi)) return;   // already matched, ignore

  const ti=S.mSel, first=!S.mAtt.includes(ti);

  if(d.oi===ti){
    // ✅ Correct match!
    S.mMat.push(ti);
    if(first) S.mSc++;
    S.mSel=null;
    if(S.mMat.length===D.mp[S.lang].length){
      setTimeout(()=>{ S.mDn=true; updHome(); rendMP(); }, 420);
    } else {
      rendMP();
    }
  } else {
    // ❌ Wrong match
    if(!S.mAtt.includes(ti)) S.mAtt.push(ti);
    const de=$(`md${si}`), te=$(`mt${ti}`);
    if(de) de.classList.add('wfl');
    if(te) te.classList.add('wfl');
    setTimeout(()=>{ S.mSel=null; rendMP(); }, 620);
  }
}
function retMP(){ S.mDn=false; initMP(); rendMP(); }

// ═══════════════════════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════════════════════
function showRes(){
  const U=u();
  const ts=S.tDn?S.tSc:0, ms=S.mDn?S.mSc:0, tot=ts+ms;
  const pct=(tot/25)*100;

  set('rTtl',U.rT); set('rSub',U.rS);
  set('rTL',U.rTL); set('rML',U.rML); set('rTotL',U.rTotL);
  $('rHB').textContent=U.rH; $('rRB').textContent=U.rR;

  set('rTS', S.tDn ? ts : '—');
  set('rMS', S.mDn ? ms : '—');
  set('rTotS', (S.tDn||S.mDn) ? tot : '—');
  set('rTotM', '/ 25');

  // Animate progress bars
  setTimeout(()=>{
    $('rTBar').style.width = S.tDn ? `${(ts/15)*100}%` : '0%';
    $('rMBar').style.width = S.mDn ? `${(ms/10)*100}%` : '0%';
  }, 160);

  // Grade message
  let gr='';
  if(S.tDn && S.mDn){
    if(pct>=88)      gr=U.gS;
    else if(pct>=72) gr=U.gA;
    else if(pct>=56) gr=U.gB;
    else             gr=U.gC;
  } else if(S.tDn || S.mDn){
    gr = U.partDone;
  } else {
    gr = U.noDone;
  }
  set('rGr', gr);
  showScreen('rr');
}

function resetAll(){
  S.tI=0; S.tSc=0; S.tDn=false;
  S.mSc=0; S.mDn=false; S.mSel=null;
  S.mMat=[]; S.mAtt=[]; S.mShuf=[];
  updHome(); goHome();
}

// ═══════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS (Flashcard navigation)
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if(S.sec==='fc' && $('sec').classList.contains('active')){
    if(e.key==='ArrowLeft')          fcPr();
    else if(e.key==='ArrowRight')    fcNx();
    else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); fcFlp(); }
  }
});
</script>
